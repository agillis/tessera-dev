# Sensor. Home Assistant: homeassistant/components/sensor.
# Home Assistant's own facts for it (flags, actions) come from its source: catalogue/_ha.json (tools/read_ha_source.py).
# docs/CATALOGUE.md says what every key means.
domain: sensor
displays:
  standard: {}
  watch: {}
  # A line of its history, for a sensor whose history is numbers (history_card.kind): a status sensor has none.
  graph:
    needs: {history: line}
